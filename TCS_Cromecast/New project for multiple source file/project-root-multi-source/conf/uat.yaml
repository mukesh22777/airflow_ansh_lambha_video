env: uat
aws:
  access_key: "REPLACE_ME"
  secret_key: "REPLACE_ME"
  endpoint: "s3.amazonaws.com"
  boto3_endpoint: "https://s3.amazonaws.com"
  region: "us-east-1"
destination:
  s3_bucket: "my-data-bucket"
  s3_prefix: "medallion/uat"
sources:
  csv:
    type: "csv"
    location_type: "s3"
    path_or_table: "s3://my-source-bucket/daily/sample.csv"
  json:
    type: "json"
    location_type: "s3"
    path_or_table: "s3://my-source-bucket/daily/sample.json"
  table:
    type: "table"
    location_type: "sqlserver"
    path_or_table: "dbo.customer_orders"
    jdbc_url: "jdbc:sqlserver://uat-sql-host:1433;databaseName=medallion_db"
    username: "uat_user"
    password: "REPLACE_ME"
    driver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"